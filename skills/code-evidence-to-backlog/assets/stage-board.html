<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project stage board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#000050;--body:#2A2F6E;--muted:#5A5F8A;--panel:#ECF1F4;--lime:#B0F467;--aqua:#93DFE3;--blue:#3F4FE0;--yellow:#FCFE67;--line:#D5DCE6;--white:#fff;--warn:#8A5A00;--warnbg:#FFF4CC}
*{box-sizing:border-box}
html,body{margin:0;background:#F7F9FB;color:var(--body);font-family:Poppins,"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.top{background:var(--navy);color:#fff;padding:16px 20px 0}
.toprow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin:0 0 4px}
.pname{background:transparent;border:1px solid transparent;border-radius:6px;color:#fff;font-size:24px;font-weight:500;padding:2px 6px;margin-left:-6px;min-width:12ch;max-width:100%}
.pname:hover:not([readonly]),.pname:focus{border-color:rgba(255,255,255,.35);outline:none}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:12px;opacity:.8}
.stat.alert{background:var(--yellow);color:var(--navy)}
.stepper{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.step{flex:1;min-width:120px;padding:8px 12px;border-radius:8px 8px 0 0;background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);font-size:13px;border:0;text-align:left}
.step small{display:block;font-size:11px;opacity:.8}
.step.done{color:#fff}
.step.done::after{content:" ✓";color:var(--lime)}
.step.cur{background:#F7F9FB;color:var(--navy);font-weight:600}
.tabs{display:flex;gap:8px;padding:12px 20px 0;align-items:center;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 4px;font-weight:500;color:var(--muted)}
.tab[aria-selected=true]{color:var(--navy);border-color:var(--lime)}
.note{font-size:12px;color:var(--muted);margin-left:auto}
.banner{margin:10px 20px 0;padding:8px 12px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:13px}
.inbox{margin:12px 20px 0;border:1.5px dashed #B6C0D0;border-radius:12px;padding:10px 12px;background:#fff}
.inbox h2{font-size:13px;margin:0 0 6px;font-weight:600;color:var(--navy)}
.inrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--panel);font-size:13px}
.inrow:first-of-type{border-top:0}
.inrow .txt{flex:1}
.inrow .act{color:var(--blue);font-size:12px}
.inadd{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.inadd input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn.primary{background:var(--navy);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:3px 8px;font-size:12px}
.board{display:flex;gap:12px;padding:14px 20px 28px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 300px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.col.cur{border:2px solid var(--navy);box-shadow:0 0 0 4px rgba(176,244,103,.45)}
.col.slim{flex-basis:240px}
.colhead h3{margin:0;font-size:17px;color:var(--navy);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colhead p{margin:2px 0 8px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--panel);color:var(--navy)}
.tag.cur{background:var(--lime)}
.tag.early{background:var(--aqua)}
.tag.spine{background:var(--navy);color:#fff}
.lane{border-radius:10px;background:var(--panel);padding:6px;margin-bottom:8px;min-height:44px}
.lane.over{outline:2px dashed var(--blue)}
.lane h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.lane.human{background:var(--warnbg)}
.lane.human h4{color:var(--warn)}
.lane.done{background:#EEFBDD}
.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;color:var(--body)}
.card:hover,.card:focus-visible{border-color:var(--navy);outline:none}
.card .t{font-weight:600;color:var(--navy);font-size:13px}
.card .id{font-size:11px;color:var(--muted);margin-right:4px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.card .art{color:var(--muted);font-size:11.5px;margin-top:2px}
.prov{font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.prov.H{color:#2E6B00}.prov.AI{color:var(--warn)}.prov.AIV{color:var(--blue)}
.qs{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.qa{margin:2px 0 6px 22px;font-size:12px}
.qa .ans{color:var(--body);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa.open .ans{display:block;-webkit-line-clamp:unset}
.qa .none{color:var(--muted);font-style:italic}
.qa textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;margin-top:4px}
.qa .bo{color:var(--muted);font-size:11.5px;margin-top:3px}
.qa .bo button{background:none;border:0;padding:0;color:var(--blue);font-size:11.5px;text-decoration:underline}
.qbtn{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.qbtn:hover{color:var(--blue)}
.qs h4{margin:0 0 4px;font-size:12px;color:var(--navy)}
.q{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:2px 0}
.q input{margin-top:3px}
.q .prop{font-size:10.5px;color:var(--muted)}
.gate{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--navy);color:#fff;font-size:12.5px}
.gate.passed{background:#EEFBDD;color:var(--navy)}
.gate .btn{margin-top:6px}
.outnote{font-size:11.5px;color:var(--muted);margin-top:6px}
.scope{padding:14px 20px 40px;max-width:1100px}
.scope h2{color:var(--navy);font-size:20px;margin:18px 0 2px}
.scope h3{font-size:14px;margin:12px 0 4px;color:var(--blue)}
.scope p.sub{margin:0 0 6px;color:var(--muted);font-size:13px}
table.lib{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.lib th,.lib td{padding:6px 8px;border-top:1px solid var(--panel);text-align:left;vertical-align:top}
.lib th{background:var(--panel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.lib tr.out td{color:#9AA0BC}
.lib input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}
.scopesum{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
dialog{border:0;border-radius:14px;padding:0;max-width:680px;width:calc(100% - 32px);color:var(--body)}
dialog::backdrop{background:rgba(0,0,80,.35)}
.dlg{padding:18px}
.dlg h2{margin:0 0 2px;font-size:18px;color:var(--navy)}
.dlg label{display:block;font-size:12px;font-weight:500;margin:10px 0 3px;color:var(--navy)}
.dlg input[type=text],.dlg input[type=url],.dlg select,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.dlg .row{display:flex;gap:10px}
.dlg .row>div{flex:1}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.err{color:#B3261E;font-size:12px;min-height:1em;margin-top:4px}
.kn{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.kn h3{margin:0 0 6px;font-size:14px;color:var(--navy)}
.ent{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12.5px}
.ent.unchecked{border-color:#E8C35A;background:#FFFBEA}
.ent .eh{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ent .et{font-weight:600;color:var(--navy)}
.ent .em{color:var(--muted);font-size:11.5px;margin-top:2px}
.ent{padding:6px 10px;margin-bottom:6px}
.ent>summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
.ent>summary::-webkit-details-marker{display:none}
.ent>summary::after{content:"\25B8";margin-left:auto;color:var(--muted);font-size:11px}
.ent[open]>summary{margin-bottom:6px}
.ent[open]>summary::after{content:"\25BE"}
.ent>summary .et{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addnote>summary{cursor:pointer;font-size:12px;font-weight:500;color:var(--navy);margin-top:6px}
.ent details{margin-top:4px}
.ent summary{cursor:pointer;color:var(--blue);font-size:12px}
.ent .body{white-space:pre-wrap;font-size:12.5px;margin-top:4px;max-height:280px;overflow:auto;background:#fff;border-radius:6px;padding:6px 8px;border:1px solid var(--panel)}
.ent.stale{border-color:#E5A3A0;background:#FFF5F4}
.ent.gone{opacity:.6}
.ent.gone .et{text-decoration:line-through}
.uses{font-size:11.5px;color:var(--muted);margin-top:3px}
.uses b{font-weight:500}
.warnline{font-size:12px;color:#9B1C1C;margin-top:3px}
.chk{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chk input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
dialog{max-height:90vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* spacing pass */
.inadd[hidden]{display:none}
.dlg{display:flex;flex-direction:column;padding-top:0}
.dlg>.actions{order:-1;position:sticky;top:0;z-index:3;margin:0 -18px 14px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);justify-content:flex-end}
dialog{overflow:auto}
.note{margin-left:auto}
.inboxbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:5px 14px;font-weight:500;font-size:13px}
.inboxbtn[aria-expanded=true]{background:var(--navy);color:#fff}
.inboxbtn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#E5484D;color:#fff;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.inboxbtn .badge.zero{background:var(--panel);color:var(--muted)}
#inbox[hidden]{display:none}
body{font-size:14.5px;line-height:1.55}
.top{padding:22px 32px 0}
.stats{gap:12px}
.stat{min-width:0;padding:10px 16px;border-radius:12px}
.stat b{font-size:19px}
.stepper{margin-top:20px;gap:6px}
.step{padding:10px 16px}
.step small{display:none}
.step.cur small{display:block;opacity:.75;font-weight:400}
.tabs{padding:18px 32px 0;gap:20px}
.banner{margin:12px 32px 0}
.inbox{margin:18px 32px 0;padding:12px 18px;border-radius:14px}
.inbox h2{margin:0;font-size:13.5px}
.inhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.inhead .muted{color:var(--muted);font-size:13px}
.inrow{padding:10px 0}
.board{gap:20px;padding:24px 32px 40px}
.col{flex:0 0 380px;padding:20px 18px;border-radius:18px}
.col.slim{flex-basis:330px}
.colhead h3{font-size:18px}
.colhead p{margin:4px 0 16px;font-size:12.5px}
.lane{padding:10px;margin-bottom:12px;border-radius:12px;min-height:0}
.lane h4{margin:0 0 10px;font-size:11px;letter-spacing:.06em}
.lane.empty{padding:8px 10px;background:transparent;border:1px dashed var(--line)}
.lane.empty h4{margin:0;color:#A0A6C0}
.lane.empty.human,.lane.empty.done{background:transparent}
.card{padding:12px 14px;margin-bottom:10px;border-radius:10px;font-size:13px}
.card:last-child{margin-bottom:0}
.card .id{display:block;font-size:11px;letter-spacing:.04em;margin:0 0 2px}
.card .t{font-size:14px;line-height:1.35}
.card .meta{margin-top:8px;gap:6px}
.spinedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--navy);margin-right:6px;vertical-align:1px}
.qs{margin-top:8px;padding-top:14px}
.qs h4{margin:0 0 10px;font-size:12px}
.qcard{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--body);line-height:1.4}
.qcard:hover,.qcard:focus-visible{border-color:var(--navy);outline:none}
.qdot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:4px;border:2px solid #B6C0D0}
.qdot.ok{background:#5BB536;border-color:#5BB536}.qdot.wait{background:#F2C14E;border-color:#F2C14E}.qdot.bad{background:#D9534F;border-color:#D9534F}
.gate{margin-top:14px;padding:12px 14px;border-radius:12px}
.outnote{margin-top:10px}
@media print{.tabs,.inadd,.btn{display:none}.board{flex-wrap:wrap;overflow:visible}}
.cardwrap{margin-bottom:10px}
.cardwrap:last-child{margin-bottom:0}
.cardwrap .card{margin-bottom:0}
.card.hasrun{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.runai{display:block;width:100%;background:#33363D;border:1px solid #33363D;color:#fff;font-weight:600;font-size:12.5px;padding:7px 10px;border-radius:0 0 10px 10px;cursor:pointer;text-align:center;letter-spacing:.01em}
.runai:hover{background:#4A4E57}
.runai:focus-visible{background:#4A4E57;outline:2px solid #fff;outline-offset:-4px}
.ailive{margin-top:8px;font-size:11.5px;font-weight:500;color:var(--blue)}
.runbox{margin:12px 0 4px;border:1px solid #33363D;border-radius:12px;overflow:hidden;background:#fff}
.runbig{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:#33363D;border:0;color:#fff;padding:12px 14px;cursor:pointer;text-align:left}
.runbig>span:first-child{font-size:17px;font-weight:700}
.runsub{font-size:12px;font-weight:500;opacity:.85}
.runbig:hover{background:#4A4E57}
.runbig:focus-visible{background:#4A4E57;outline:2px solid #fff;outline-offset:-4px}
.runbody{padding:10px 14px 12px;font-size:13px}
.runbody p{margin:0 0 6px}
.runopts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.runopt{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.runone{margin-bottom:8px}
.runwhat{background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px}
.runwarn{color:var(--warn);background:var(--warnbg);border-radius:6px;padding:4px 8px}
.runbody textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}
.runact{display:flex;gap:8px;margin-top:8px}
.runmsg{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}
.runlive{padding:6px 14px;font-size:12px;font-weight:500;color:var(--blue);background:#EEF0FF}
@media print{.runai,.runbox{display:none}}
.arts{max-width:1000px;padding:4px 20px 28px}
.artsec{margin:14px 0}
.artsec h3{font-size:14px;color:var(--navy);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.artcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.artcardh{background:none;border:0;padding:0;font-weight:600;color:var(--navy);font-size:13.5px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.artcardh .id{font-size:11px;color:var(--muted)}
.artlist{list-style:none;margin:6px 0 0;padding:0}
.artlist li{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0;border-top:1px solid var(--panel);font-size:12.5px}
.arttitle{font-weight:500;color:var(--navy)}
a.arttitle{color:var(--blue)}
.artnote{color:var(--muted);font-size:12px}
.artpath{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--muted);padding:1px 6px;cursor:pointer;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artfilter{display:flex;gap:14px;font-size:12.5px;margin:8px 0}
.outs{margin:12px 0 4px}
.outs h3{font-size:13px;margin:0 0 6px;color:var(--navy)}
.entsec{margin-top:10px}
.entlab{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.entchk{background:#FFF8E1;border:1px solid #F2D27A;border-radius:8px;padding:8px 10px}
.entchk .entlab{color:#7A5200}
.entul{margin:0;padding-left:18px;font-size:13px;line-height:1.5}
.entul li{margin:2px 0}
.entul.plain{list-style:none;padding-left:0}
.entp{margin:0;font-size:13px;line-height:1.5}
.ent .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);word-break:break-all}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-size:12px;text-decoration:underline}
.reffile{color:var(--muted);font-size:12px}
.refcode{color:#8A90A8;font-size:10.5px;font-weight:500;margin-left:4px;white-space:nowrap}
.todobox{margin:12px 0 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.todobox .tdh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.todobox .tdh b{font-size:14px;color:var(--navy)}
.todobox .tdh span{font-size:11.5px;color:var(--muted)}
.tdl{list-style:none;margin:6px 0 0;padding:0}
.tdl li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid #EEF0F3;font-size:13px;line-height:1.4}
.tdl li:first-child{border-top:0}
.tdl .tdt{flex:1;min-width:0}
.tdl .tdsrc{font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px;white-space:nowrap;margin-top:1px}
.tdl .tdsrc.ai{background:#EDE9FE;color:#4C1D95}.tdl .tdsrc.h{background:#E6F7F5;color:#0B5C55}
.tdl .tdgo{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-size:12px;text-decoration:underline;white-space:nowrap}
.tdl input[type=checkbox]{margin-top:3px}
.tdadd{display:flex;gap:6px;margin-top:8px}
.tdadd input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;background:#fff}
.tdnone{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.who{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.who.h{background:#E6F7F5;color:#0B5C55}
.who.ai{background:#EDE9FE;color:#4C1D95}
.kngrp{margin-top:8px}
.kglab{font-size:12.5px;color:var(--navy);margin:6px 0}
.kglab span{color:var(--muted);font-size:12px}
.tdetails{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.tdetails h3,.kn h3{font-size:13px;margin:0 0 6px;color:var(--navy)}
.addout{margin-top:4px}
.addout>summary{cursor:pointer;font-size:12.5px;font-weight:500;color:var(--navy)}
.addoutf{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.addoutf input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}
.addoutf .btn{align-self:flex-start}
.remove{margin-top:12px}
.remove>summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.rmrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:12.5px}
.rmrow p{margin:2px 0 6px;color:var(--muted)}

 try{const u=new URL(base);const id=u.searchParams.get("id");
  if(id){const full=rel?id.replace(/\/+$/,"")+"/"+rel:id;u.searchParams.delete("id");u.searchParams.delete("viewid");u.searchParams.delete("parent");const q=u.searchParams.toString();const isFile=/\.[a-z0-9]{2,5}$/i.test(rel);return u.origin+u.pathname+"?"+(q?q+"&":"")+"id="+encodeURIComponent(full)+(isFile?"&parent="+encodeURIComponent(full.replace(/\/[^/]*$/,"")):"")}
